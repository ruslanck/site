<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ПРОКАЧКА · кликер с магазином</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            user-select: none;
        }
        body {
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(45deg, #0b1c2f, #1d3a4e);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }
        .game-wrapper {
            max-width: 800px;
            width: 100%;
            background: rgba(18, 34, 48, 0.8);
            backdrop-filter: blur(10px);
            border-radius: 4rem 4rem 3rem 3rem;
            padding: 2rem 2rem 2.5rem;
            box-shadow: 0 30px 40px rgba(0,0,0,0.7), inset 0 0 3px #87b9e9;
            border: 1px solid #38658b;
        }
        /* шапка с ресурсами */
        .resources {
            display: flex;
            justify-content: space-between;
            background: #0e1f2b;
            padding: 1.2rem 2rem;
            border-radius: 6rem;
            margin-bottom: 2rem;
            border: 1px solid #2f5f82;
            box-shadow: inset 0 5px 5px rgba(0,0,0,0.7), 0 4px 0 #1a3f55;
            color: white;
            font-weight: bold;
            flex-wrap: wrap;
            gap: 15px;
        }
        .res-item {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.5rem;
            background: #0b1923;
            padding: 0.4rem 1.6rem;
            border-radius: 3rem;
            border: 1px solid #3e6d8f;
        }
        .res-item span {
            background: #1c3343;
            padding: 0.3rem 1.2rem;
            border-radius: 2rem;
            font-size: 2rem;
            line-height: 1;
            color: #f9d77e;
            text-shadow: 0 3px 3px black;
            font-family: 'Courier New', monospace;
            border: 1px solid #618aa9;
            min-width: 80px;
            text-align: center;
        }
        .level-badge {
            background: #8a6f2c;
            color: #ffefc0;
            font-size: 1.5rem;
            padding: 0.4rem 1.8rem;
            border-radius: 3rem;
            border: 1px solid #f3b33d;
            box-shadow: 0 0 12px #ffb347;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        /* главная кликабельная зона */
        .click-area {
            background: #1b3f57;
            border-radius: 4rem;
            padding: 2rem;
            margin-bottom: 2.5rem;
            border: 4px solid #68a2cf;
            box-shadow: inset 0 -10px 0 #0e2c3b, 0 18px 25px -8px black;
            transition: 0.1s;
        }
        .click-btn {
            width: 100%;
            aspect-ratio: 3/1;
            background: radial-gradient(circle at 40% 40%, #ffe484, #d79b1a);
            border: none;
            border-radius: 10rem;
            font-size: 3.2rem;
            font-weight: 800;
            color: #271f0a;
            text-shadow: 0 3px 5px #ffdd99;
            box-shadow: 0 18px 0 #9e681c, 0 20px 25px black;
            cursor: pointer;
            transition: 0.06s linear;
            border: 2px solid #ffd966;
            letter-spacing: 3px;
            touch-action: manipulation;
        }
        .click-btn:active {
            transform: translateY(12px);
            box-shadow: 0 6px 0 #9e681c, 0 12px 25px black;
        }
        .click-btn:disabled {
            opacity: 0.5;
            transform: translateY(8px);
            box-shadow: 0 8px 0 #7b5019;
            pointer-events: none;
        }
        /* магазин и улучшения */
        .shop-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            color: #b1dcfd;
            font-size: 1.8rem;
            margin-bottom: 1.2rem;
            padding: 0 10px;
        }
        .upgrades-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
            gap: 20px;
            margin-top: 15px;
        }
        .upgrade-card {
            background: #153645;
            border-radius: 2.5rem;
            padding: 1.4rem 1rem 1.8rem;
            border: 2px solid #2b6c93;
            box-shadow: 0 9px 0 #0e2835, 0 6px 15px black;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            transition: 0.1s;
            color: #e2f0ff;
        }
        .upgrade-card h3 {
            font-size: 1.7rem;
            margin: 0 0 8px;
            color: #ffd966;
        }
        .upgrade-desc {
            font-size: 1.1rem;
            margin-bottom: 12px;
            background: #0d2b3b;
            padding: 5px 12px;
            border-radius: 3rem;
            width: fit-content;
        }
        .stat-row {
            display: flex;
            justify-content: center;
            gap: 15px;
            font-size: 1.4rem;
            font-weight: bold;
            background: #102a35;
            padding: 6px 18px;
            border-radius: 3rem;
            margin: 8px 0;
            border: 1px solid #3f84a5;
        }
        .buy-btn {
            background: #246b46;
            border: none;
            font-size: 1.8rem;
            font-weight: bold;
            padding: 0.8rem 2.2rem;
            border-radius: 4rem;
            color: #ebffdb;
            box-shadow: 0 7px 0 #124b2f, 0 6px 12px black;
            cursor: pointer;
            transition: 0.05s linear;
            margin-top: 10px;
            width: 100%;
            border: 1px solid #6fc18b;
            touch-action: manipulation;
        }
        .buy-btn:active {
            transform: translateY(5px);
            box-shadow: 0 2px 0 #124b2f, 0 6px 12px black;
        }
        .buy-btn:disabled {
            opacity: 0.4;
            transform: translateY(4px);
            box-shadow: 0 3px 0 #0f3823;
            pointer-events: none;
        }
        .level-info {
            background: #1f3d4e;
            font-size: 1.3rem;
            padding: 10px 20px;
            border-radius: 3rem;
            color: #cfecff;
            border: 1px solid #528eb3;
            text-align: center;
        }
        .footer-msg {
            color: #8db4d0;
            margin-top: 22px;
            font-size: 1.2rem;
            text-align: center;
        }
    </style>
</head>
<body>
<div class="game-wrapper">
    <!-- ресурсы и уровень -->
    <div class="resources">
        <div class="res-item">
            💎 Монет <span id="coinDisplay">0</span>
        </div>
        <div class="level-badge" id="levelDisplay">
            ⭐ УРОВЕНЬ 1
        </div>
        <div class="res-item">
            👆 Кликов <span id="clickDisplay">0</span>
        </div>
    </div>

    <!-- главная кнопка кликера -->
    <div class="click-area">
        <button class="click-btn" id="clickButton">👆 ТЫК</button>
    </div>

    <!-- магазин и прокачка -->
    <div class="shop-header">
        <span>⚡ МАГАЗИН УЛУЧШЕНИЙ</span>
        <span class="level-info" id="multiplierInfo">×1 за клик</span>
    </div>

    <div class="upgrades-grid" id="shopContainer">
        <!-- карточки будут сгенерированы через JS -->
    </div>
    <div class="footer-msg">
        🚀 Каждый клик приносит монеты. Покупай усиления — ракета летит выше!
    </div>
</div>

<script>
    (function() {
        // ---------- СОСТОЯНИЕ ИГРОКА ----------
        let coins = 0;              // монеты
        let totalClicks = 0;        // всего совершено кликов (для уровня)
        let clickPower = 1;         // базовая монета за клик (может увеличиваться от улучшений)

        // Множитель от уровня (уровень рассчитывается от количества кликов)
        let currentLevel = 1;
        const clicksForNextLevel = [0, 10, 30, 70, 150, 300, 600, 1200, 2500, 5000]; // уровень 1: 0-9, 2:10-29 и т.д.

        // ---------- УЛУЧШЕНИЯ (МАГАЗИН) ----------
        const upgrades = [
            { id: 'cursor', name: '🖱️ Курсор', desc: '➕1 к монете за клик', baseCost: 15, costMultiplier: 1.8, stat: 'clickPower', value: 1, count: 0 },
            { id: 'pickaxe', name: '⛏️ Кирка', desc: '➕3 к монете за клик', baseCost: 50, costMultiplier: 1.9, stat: 'clickPower', value: 3, count: 0 },
            { id: 'drill', name: '🪨 Дрель', desc: '➕8 за клик', baseCost: 180, costMultiplier: 2.0, stat: 'clickPower', value: 8, count: 0 },
            { id: 'robot', name: '🤖 Робот', desc: '➕20 за клик', baseCost: 600, costMultiplier: 2.2, stat: 'clickPower', value: 20, count: 0 }
        ];

        // ссылки на DOM
        const coinDisplay = document.getElementById('coinDisplay');
        const clickDisplay = document.getElementById('clickDisplay');
        const levelDisplay = document.getElementById('levelDisplay');
        const multiplierInfo = document.getElementById('multiplierInfo');
        const clickButton = document.getElementById('clickButton');
        const shopContainer = document.getElementById('shopContainer');

        // отрисовка карточек магазина
        function renderShop() {
            shopContainer.innerHTML = ''; // очистить
            upgrades.forEach((up, index) => {
                const card = document.createElement('div');
                card.className = 'upgrade-card';

                // текущая стоимость
                const cost = Math.floor(up.baseCost * Math.pow(up.costMultiplier, up.count));

                // заголовок и описание
                card.innerHTML = `
                    <h3>${up.name}</h3>
                    <div class="upgrade-desc">${up.desc}</div>
                    <div class="stat-row">
                        <span>📊 ур. ${up.count}</span>
                        <span>💰 ${cost}</span>
                    </div>
                    <button class="buy-btn" data-index="${index}">Купить</button>
                `;
                shopContainer.appendChild(card);
            });

            // навесить обработчики на кнопки "Купить"
            document.querySelectorAll('.buy-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const idx = e.target.getAttribute('data-index');
                    if (idx !== null) buyUpgrade(parseInt(idx));
                });
            });

            // обновить активность кнопок (блокировка если не хватает монет)
            updateBuyButtonsState();
        }

        // обновить доступность кнопок покупки
        function updateBuyButtonsState() {
            document.querySelectorAll('.buy-btn').forEach((btn, i) => {
                const up = upgrades[i];
                if (!up) return;
                const cost = Math.floor(up.baseCost * Math.pow(up.costMultiplier, up.count));
                if (coins < cost) {
                    btn.disabled = true;
                } else {
                    btn.disabled = false;
                }
            });
        }

        // покупка улучшения
        function buyUpgrade(index) {
            const up = upgrades[index];
            const cost = Math.floor(up.baseCost * Math.pow(up.costMultiplier, up.count));
            if (coins < cost) return;

            // списываем монеты
            coins -= cost;
            // увеличиваем счетчик улучшения
            up.count += 1;

            // применяем эффект в зависимости от stat
            if (up.stat === 'clickPower') {
                clickPower += up.value;
            }

            // обновить интерфейс
            updateUI();
            renderShop();          // перерисовать магазин (цены изменятся, кол-во)
        }

        // функция для расчета уровня на основе кликов
        function calculateLevel(clicks) {
            let lvl = 1;
            for (let i = 1; i < clicksForNextLevel.length; i++) {
                if (clicks >= clicksForNextLevel[i]) {
                    lvl = i + 1;
                } else {
                    break;
                }
            }
            return lvl;
        }

        // вызывается при любом изменении денег/кликов/уровня
        function updateUI() {
            coinDisplay.textContent = coins;
            clickDisplay.textContent = totalClicks;

            // уровень
            const newLevel = calculateLevel(totalClicks);
            if (newLevel !== currentLevel) {
                currentLevel = newLevel;
                // можно добавить бонус за уровень, но оставим просто престиж
            }
            levelDisplay.innerHTML = `⭐ УРОВЕНЬ ${currentLevel}`;

            // множитель (сколько монет за клик)
            multiplierInfo.innerText = `×${clickPower} за клик`;

            // активировать/деактивировать кнопки магазина
            updateBuyButtonsState();
        }

        // клик по главной кнопке
        function handleClick() {
            // 1) зарабатываем монеты (clickPower)
            coins += clickPower;
            // 2) увеличиваем общее число кликов
            totalClicks++;

            // проверка на уровень (апнули уровень?)
            const oldLevel = currentLevel;
            const newLevel = calculateLevel(totalClicks);
            if (newLevel > oldLevel) {
                // можно дать награду, например +10 монет за каждый новый уровень (бонус)
                coins += 10 * (newLevel - oldLevel);  // скромный бонус
            }

            // обновляем UI
            updateUI();

            // маленькая вибро-отдача на мобильных (не обязательно)
        }

        // стартовая инициализация и подгрузка
        function initGame() {
            // начальные значения (можно изменить для баланса)
            coins = 5;          // стартовый капитал
            totalClicks = 0;
            clickPower = 1;     // базовая единица
            upgrades.forEach(u => u.count = 0); // сброс прокачки

            renderShop();
            updateUI();

            // обработчик клика
            clickButton.addEventListener('click', handleClick);
            // для мобильных touch
            clickButton.addEventListener('touchstart', (e) => {
                e.preventDefault();
                handleClick();
            });
        }

        // дополнительно: обновление состояния кнопок после перерисовки магазина уже есть в renderShop

        // запуск
        initGame();

        // вспомогательный пересчет при изменении монет из вне (нет, только через клик и покупки)
        // но после покупки мы вызываем renderShop и updateUI
        // небольшой фикс: после покупки updateUI уже вызывается в buyUpgrade, а renderShop вызывает updateBuyButtonsState внутри себя.

        // добавим функцию-хелпер для обновления баланса при покупке уже есть

        // дополнительно: защита от двойного клика на мобильных
        let clickInProgress = false;
        const originalHandler = handleClick;
        handleClick = function() {
            if (clickInProgress) return;
            clickInProgress = true;
            originalHandler();
            setTimeout(() => clickInProgress = false, 200);
        };

        // перезаписываем обработчик
        clickButton.removeEventListener('click', handleClick);
        clickButton.addEventListener('click', handleClick);
        // touch события тоже
        clickButton.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (clickInProgress) return;
            clickInProgress = true;
            originalHandler();
            setTimeout(() => clickInProgress = false, 200);
        });

    })();
</script>
</body>
</html>
